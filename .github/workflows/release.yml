name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc*'
  # Manual re-run. Needed because a tag push is not a reliable trigger: GitHub fires no
  # workflow at all when more than three tags arrive in one push, which is how ten
  # releases were tagged and none were ever built. Without this the only recovery was
  # deleting the tag and pushing it again.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.21.0)'
        required: true
        type: string

# Two reliable Linux x86_64 targets: a plain CPU build (broad compatibility) and a
# Vulkan build (AMD/Intel iGPUs and any Vulkan GPU). Both validated. Other platforms
# (ROCm bundle, aarch64, macOS, Windows) can be re-added once each is verified.

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Refuse to publish a tag whose tree disagrees with it. Versions 0.14 through 0.18
  # shipped with `Cargo.toml` still reading 0.11.0 — six releases whose binary reported
  # the wrong version, because nothing checked.
  verify-version:
    name: Version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Cargo.toml must equal the tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          WANT="${TAG#v}"; WANT="${WANT%%-rc*}"
          GOT=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG  Cargo.toml=$GOT"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::Cargo.toml says $GOT but the tag says $WANT"
            exit 1
          fi
      - name: CHANGELOG must describe it
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          WANT="${TAG#v}"; WANT="${WANT%%-rc*}"
          grep -q "^## \[$WANT\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [$WANT]' entry"; exit 1; }

  build:
    needs: verify-version
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # On a tag push `github.ref_name` IS the tag, but on a manual re-run it is the
    # branch the run was dispatched from — which would name the tarball after a
    # branch and upload it to the wrong ref. `verify-version` already resolved this;
    # the rest of the job never did, so the recovery path this workflow exists for
    # was itself broken.
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU — built on 22.04 for broad glibc compatibility.
          - name: x86_64-linux
            runner: ubuntu-22.04
            suffix: ""
            gpu_deps: ""
            build_deb: true
          # Vulkan — needs Ubuntu 24.04 for glslc/spirv-headers. The resulting binary
          # needs glibc 2.39+ and a Vulkan driver at runtime (Mesa RADV/ANV, etc.).
          - name: x86_64-linux-vulkan
            runner: ubuntu-24.04
            suffix: "-vulkan"
            gpu_deps: "glslc glslang-tools libvulkan-dev spirv-headers"
          # ROCm — HIP SDK from AMD's own repo (the ROCm install step below);
          # build.rs auto-enables the HIP backend when hipcc is on PATH.
          - name: x86_64-linux-rocm
            runner: ubuntu-22.04
            suffix: "-rocm"
            gpu_deps: ""
            gpu_backend: rocm

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Separate keys per variant so a CPU build's cmake configuration can't
          # leak into the Vulkan build's target cache (or vice versa).
          key: ${{ matrix.runner }}-release${{ matrix.suffix }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.runner }}-release${{ matrix.suffix }}-

      - name: Install build dependencies
        # llama.cpp's ggml-vulkan CMake needs both the Vulkan/glslc tooling AND
        # SPIRV-Headers. build.rs auto-enables the Vulkan backend when they're present.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y build-essential cmake clang libclang-dev ninja-build ${{ matrix.gpu_deps }}

      - name: Install ROCm HIP SDK
        if: matrix.gpu_backend == 'rocm'
        run: |
          sudo mkdir -p /etc/apt/keyrings
          wget -q -O - https://repo.radeon.com/rocm/rocm.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] \
            https://repo.radeon.com/rocm/apt/6.2 jammy main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          # Give ROCm repo higher priority than Ubuntu's packages.
          # Ubuntu 22.04 ships rocminfo 5.0.0-1 (upstream versioning) which
          # apt prefers over ROCm's 1.0.0.6XXXX (Radeon versioning).
          # Pin-Priority 1001 forces ROCm packages even when they look like a downgrade.
          printf 'Package: *\nPin: origin repo.radeon.com\nPin-Priority: 1001\n' \
            | sudo tee /etc/apt/preferences.d/rocm.pref
          sudo apt-get update -q
          sudo apt-get install -y rocm-hip-sdk
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"
          echo "/opt/rocm/lib/llvm/bin" >> "$GITHUB_PATH"
          echo "HIPCC=/opt/rocm/bin/hipcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --bin fox --bin fox-bench

      - name: Package tarball
        shell: bash
        run: |
          VERSION="${TAG#v}"
          TARBALL="fox-${VERSION}-x86_64-unknown-linux-gnu${{ matrix.suffix }}.tar.gz"
          RELEASE_DIR="target/release"
          # Every shared library built beside the binaries. NOT a hand-written list of
          # prefixes: this globbed `libggml*` and `libllama*` only, so `libmtmd.so.0`
          # — which arrived with vision support in 0.17 — was left out and the shipped
          # binary could not start at all:
          #   error while loading shared libraries: libmtmd.so.0: cannot open shared
          # docker/Dockerfile.vulkan has always used `lib*.so*`; the workflow had drifted.
          FILES=(fox fox-bench)
          for so in "$RELEASE_DIR"/lib*.so*; do
            [[ -f "$so" ]] && FILES+=("$so")
          done
          tar czf "$TARBALL" -C "$RELEASE_DIR" "${FILES[@]##*/}"
          sha256sum "$TARBALL" > "${TARBALL}.sha256"
          echo "ASSET=$TARBALL" >> "$GITHUB_ENV"
          echo "ASSET_SHA256=${TARBALL}.sha256" >> "$GITHUB_ENV"

      - name: Install cargo-deb
        if: matrix.build_deb
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        if: matrix.build_deb
        shell: bash
        run: |
          cargo deb --no-build
          DEB=$(ls target/debian/*.deb)
          sha256sum "$DEB" > "${DEB}.sha256"
          echo "DEB_ASSET=$DEB" >> "$GITHUB_ENV"
          echo "DEB_ASSET_SHA256=${DEB}.sha256" >> "$GITHUB_ENV"

      - name: The .deb must actually install its binary
        # Same reasoning as the tarball smoke test below: unpack what is about to
        # be published and run it, instead of trusting the asset glob.
        if: matrix.build_deb
        shell: bash
        run: |
          SMOKE="$(mktemp -d)"
          dpkg-deb -x "$DEB_ASSET" "$SMOKE"
          LD_LIBRARY_PATH="$SMOKE/usr/lib" "$SMOKE/usr/bin/fox" --version
          echo "packaged .deb installs a binary that starts and reports its version"

      - name: The tarball must actually run
        # Unpack what is about to be published, somewhere else, and start it. v0.20.3
        # shipped a binary that died on a missing `libmtmd.so.0` and nothing noticed,
        # because packaging was only ever checked by reading the glob. A release that
        # cannot print its own version is not a release.
        shell: bash
        # The ROCm leg's libggml-hip.so pulls in the HIP runtime from /opt/rocm,
        # which the runner has but the default loader path does not; empty and
        # harmless on the other legs.
        env:
          LD_LIBRARY_PATH: ${{ matrix.gpu_backend == 'rocm' && '/opt/rocm/lib' || '' }}
        run: |
          SMOKE="$(mktemp -d)"
          tar xzf "$ASSET" -C "$SMOKE"
          "$SMOKE/fox" --version
          echo "packaged bundle starts and reports its version"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-rc') }}
          # install.sh and install.ps1 ride along with every release. The README has
          # always advertised
          #   curl -fsSL .../releases/latest/download/install.sh | sh
          # and that URL 404'd, because the only assets uploaded were the tarball and
          # its checksum. The advertised way to install fox did not work.
          # DEB_ASSET is only set on the build_deb leg; softprops skips the
          # resulting empty lines on the others.
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA256 }}
            ${{ env.DEB_ASSET }}
            ${{ env.DEB_ASSET_SHA256 }}
            install.sh
            install.ps1

  # The release page carried no notes at all: `softprops` was only ever handed files,
  # so GitHub published a bare list of six assets. Two of them are tarballs that differ
  # by a `-vulkan` suffix and nothing on the page said which was which — the one without
  # a suffix reads as the default. Someone reported `libggml-vulkan.so` missing from the
  # release; it was in the other tarball.
  #
  # Runs after both builds and writes the body once. Two matrix jobs writing it would
  # race, and the loser's version would be the one published.
  notes:
    needs: build
    name: Release notes
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build the body from the CHANGELOG
        shell: bash
        run: |
          VERSION="${TAG#v}"; VERSION="${VERSION%%-rc*}"
          python3 scripts/release_notes.py "$VERSION" > body.md
          echo "--- release body ---"; cat body.md

      - name: Publish the notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-rc') }}
          body_path: body.md
