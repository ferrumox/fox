name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc*'
  # Manual re-run. Needed because a tag push is not a reliable trigger: GitHub fires no
  # workflow at all when more than three tags arrive in one push, which is how ten
  # releases were tagged and none were ever built. Without this the only recovery was
  # deleting the tag and pushing it again.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.21.0)'
        required: true
        type: string

# Two reliable Linux x86_64 targets: a plain CPU build (broad compatibility) and a
# Vulkan build (AMD/Intel iGPUs and any Vulkan GPU). Both validated. Other platforms
# (ROCm bundle, aarch64, macOS, Windows) can be re-added once each is verified.

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Refuse to publish a tag whose tree disagrees with it. Versions 0.14 through 0.18
  # shipped with `Cargo.toml` still reading 0.11.0 — six releases whose binary reported
  # the wrong version, because nothing checked.
  verify-version:
    name: Version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Cargo.toml must equal the tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          WANT="${TAG#v}"; WANT="${WANT%%-rc*}"
          GOT=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG  Cargo.toml=$GOT"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::Cargo.toml says $GOT but the tag says $WANT"
            exit 1
          fi
      - name: CHANGELOG must describe it
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          WANT="${TAG#v}"; WANT="${WANT%%-rc*}"
          grep -q "^## \[$WANT\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [$WANT]' entry"; exit 1; }

  build:
    needs: verify-version
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU — built on 22.04 for broad glibc compatibility.
          - name: x86_64-linux
            runner: ubuntu-22.04
            suffix: ""
            gpu_deps: ""
          # Vulkan — needs Ubuntu 24.04 for glslc/spirv-headers. The resulting binary
          # needs glibc 2.39+ and a Vulkan driver at runtime (Mesa RADV/ANV, etc.).
          - name: x86_64-linux-vulkan
            runner: ubuntu-24.04
            suffix: "-vulkan"
            gpu_deps: "glslc glslang-tools libvulkan-dev spirv-headers"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Separate keys per variant so a CPU build's cmake configuration can't
          # leak into the Vulkan build's target cache (or vice versa).
          key: ${{ matrix.runner }}-release${{ matrix.suffix }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.runner }}-release${{ matrix.suffix }}-

      - name: Install build dependencies
        # llama.cpp's ggml-vulkan CMake needs both the Vulkan/glslc tooling AND
        # SPIRV-Headers. build.rs auto-enables the Vulkan backend when they're present.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y build-essential cmake clang libclang-dev ninja-build ${{ matrix.gpu_deps }}

      - name: Build
        run: cargo build --release --bin fox --bin fox-bench

      - name: Package tarball
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="fox-${VERSION}-x86_64-unknown-linux-gnu${{ matrix.suffix }}.tar.gz"
          RELEASE_DIR="target/release"
          # Bundle binaries + any backend shared libraries built alongside them
          # (fox has RPATH=$ORIGIN, so it finds them in the same directory).
          FILES=(fox fox-bench)
          for so in "$RELEASE_DIR"/libggml*.so* "$RELEASE_DIR"/libllama*.so*; do
            [[ -f "$so" ]] && FILES+=("$so")
          done
          tar czf "$TARBALL" -C "$RELEASE_DIR" "${FILES[@]##*/}"
          sha256sum "$TARBALL" > "${TARBALL}.sha256"
          echo "ASSET=$TARBALL" >> "$GITHUB_ENV"
          echo "ASSET_SHA256=${TARBALL}.sha256" >> "$GITHUB_ENV"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          # install.sh and install.ps1 ride along with every release. The README has
          # always advertised
          #   curl -fsSL .../releases/latest/download/install.sh | sh
          # and that URL 404'd, because the only assets uploaded were the tarball and
          # its checksum. The advertised way to install fox did not work.
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA256 }}
            install.sh
            install.ps1
