name: Docker

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc*'

env:
  IMAGE: ferrumox/fox

jobs:
  build:
    name: Build & push (${{ matrix.variant }}, linux/amd64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda
            dockerfile: Dockerfile
            suffix: ""
          - variant: rocm
            dockerfile: Dockerfile.rocm
            suffix: "-rocm"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The ROCm devel base image plus the build layers overflow the runner's
      # default free space; clear the preinstalled toolchains we don't use.
      - name: Free disk space
        if: matrix.variant == 'rocm'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' google-chrome-stable || true
          sudo apt-get autoremove -y
          df -h /

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` only for stable releases, never for -rc tags.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc') }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
